[project]
name = "oop-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Oksana Tishina",email = "oxtishina@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]


[tool.isort]
skip = [".venv", "htmlcov", ".git", "__pycache__"]
line_length = 119

